<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Storage Organizer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1f2937;
    color:white;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
}

h1{
    margin-top:0;
}

.panel{
    background:#374151;
    margin:20px;
    padding:20px;
    border-radius:10px;
}

label{
    display:block;
    margin-bottom:15px;
}

input,
textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#3b82f6;
}

.shelf{
    margin:20px;
}

.shelf-title{
    margin-bottom:10px;
}

.shelf-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.bin{
    width:120px;
    min-height:90px;
    border-radius:10px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.bin:hover{
    transform:scale(1.05);
}

.empty{
    background:#6b7280;
}

.full{
    background:#16a34a;
}

.hidden{
    display:none;
}

#editor textarea{
    height:150px;
}

#status{
    color:#d1d5db;
    margin-top:10px;
}

@media(max-width:700px){

    .bin{
        width:90px;
        min-height:75px;
    }

}
</style>
</head>
<body>

<header>
    <h1>Garage Storage Organizer</h1>

    <input
        id="search"
        placeholder="Search bins..."
    >
</header>

<div class="panel">

    <h2>Shelf Settings</h2>

    <label>
        Total Bins
        <input id="totalBins" type="number">
    </label>

    <label>
        Bins Per Shelf
        <input id="binsPerShelf" type="number">
    </label>

    <button id="saveLayout">
        Save Layout
    </button>

</div>

<div id="shelves"></div>

<div id="editor" class="panel hidden">

    <h2 id="binTitle"></h2>

    <label>
        Bin Name
        <input id="binName">
    </label>

    <label>
        Contents
        <textarea id="binContents"></textarea>
    </label>

    <button id="saveBin">
        Save Bin
    </button>

    <div id="status"></div>

</div>

<script>

const SUPABASE_URL =
"https://cujvvxyadxvlfvhgzlki.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wogqNQurYqmvOx9FvoFxMQ_XyRMTxZ_";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let settings = {
    totalBins: 42,
    binsPerShelf: 6
};

let bins = {};
let currentBin = null;

const shelvesEl =
document.getElementById("shelves");

async function loadSettings(){

    try{

        const { data, error } =
        await db
        .from("settings")
        .select("*")
        .eq("id",1)
        .single();

        if(error){
            console.error(error);
            return;
        }

        if(data){

            settings.totalBins =
            data.total_bins;

            settings.binsPerShelf =
            data.bins_per_shelf;
        }

        document.getElementById("totalBins").value =
        settings.totalBins;

        document.getElementById("binsPerShelf").value =
        settings.binsPerShelf;

    }
    catch(err){
        console.error(err);
    }
}

async function loadBins(){

    try{

        const { data, error } =
        await db
        .from("bins")
        .select("*");

        if(error){
            console.error(error);
            return;
        }

        bins = {};

        data.forEach(bin => {

            bins[bin.id] = {
                name: bin.name || "",
                contents: bin.contents || "",
                updated_at: bin.updated_at || ""
            };

        });

    }
    catch(err){
        console.error(err);
    }

}

function renderBins(filter=""){

    shelvesEl.innerHTML = "";

    let shelfRow;

    for(let i=1;i<=settings.totalBins;i++){

        if((i - 1) % settings.binsPerShelf === 0){

            const shelf =
            document.createElement("div");

            shelf.className = "shelf";

            const shelfNumber =
            Math.floor(
                (i - 1) /
                settings.binsPerShelf
            ) + 1;

            shelf.innerHTML =
            `<h2 class="shelf-title">Shelf ${shelfNumber}</h2>`;

            shelfRow =
            document.createElement("div");

            shelfRow.className =
            "shelf-row";

            shelf.appendChild(shelfRow);

            shelvesEl.appendChild(shelf);
        }

        const binId =
        `BIN${String(i).padStart(2,"0")}`;

        const bin =
        bins[binId] || {
            name:"",
            contents:""
        };

        const searchText =
        (
            bin.name +
            " " +
            bin.contents
        ).toLowerCase();

        if(
            filter &&
            !searchText.includes(
                filter.toLowerCase()
            )
        ){
            continue;
        }

        const card =
        document.createElement("div");

        card.className =
        "bin " +
        (
            bin.contents.trim()
            ? "full"
            : "empty"
        );

        card.innerHTML =
        `
        <strong>${binId}</strong>
        <br>
        <small>${bin.name || "Empty"}</small>
        `;

        card.addEventListener(
            "click",
            () => openBin(binId)
        );

        shelfRow.appendChild(card);
    }
}

function openBin(id){

    currentBin = id;

    const bin =
    bins[id] || {};

    document
    .getElementById("editor")
    .classList
    .remove("hidden");

    document
    .getElementById("binTitle")
    .textContent = id;

    document
    .getElementById("binName")
    .value =
    bin.name || "";

    document
    .getElementById("binContents")
    .value =
    bin.contents || "";

    document
    .getElementById("status")
    .textContent =
    bin.updated_at
    ? "Last Updated: " +
      new Date(bin.updated_at)
      .toLocaleString()
    : "Never Updated";
}

async function saveCurrentBin(){

    if(!currentBin) return;

    const now =
    new Date().toISOString();

    const { error } =
    await db
    .from("bins")
    .upsert({
        id: currentBin,
        name:
            document.getElementById("binName").value,
        contents:
            document.getElementById("binContents").value,
        updated_at: now
    });

    if(error){
        console.error(error);
        alert(error.message);
        return;
    }

    await loadBins();

    renderBins(
        document.getElementById("search").value
    );

    document.getElementById("status").textContent =
    "Last Updated: " +
    new Date(now).toLocaleString();

    alert("Saved");
}

async function saveLayout(){

    const { error } =
    await db
    .from("settings")
    .upsert({
        id: 1,
        total_bins:
            parseInt(
                document.getElementById("totalBins").value
            ),
        bins_per_shelf:
            parseInt(
                document.getElementById("binsPerShelf").value
            )
    });

    if(error){
        console.error(error);
        alert(error.message);
        return;
    }

    await loadSettings();

    renderBins();
}

document
.getElementById("saveBin")
.addEventListener(
    "click",
    saveCurrentBin
);

document
.getElementById("saveLayout")
.addEventListener(
    "click",
    saveLayout
);

document
.getElementById("search")
.addEventListener(
    "input",
    e => renderBins(e.target.value)
);

async function init(){

    console.log("Starting app...");

    await loadSettings();
    await loadBins();

    renderBins();

    console.log("App loaded");
}

init().catch(console.error);

</script>

</body>
</html>

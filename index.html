<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage Storage Organizer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1f2937;
    color:white;
}

header{
    padding:20px;
    text-align:center;
    background:#111827;
}

h1{
    margin:0 0 15px;
}

input, textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#3b82f6;
}

.panel{
    background:#374151;
    margin:20px;
    padding:20px;
    border-radius:10px;
}

.shelf{
    margin-bottom:25px;
}

.shelf-title{
    margin-bottom:10px;
}

.shelf-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.bin{
    width:120px;
    min-height:90px;
    border-radius:10px;
    padding:10px;
    cursor:pointer;
    text-align:center;
    transition:0.2s;
}

.bin:hover{
    transform:scale(1.05);
}

.empty{
    background:#6b7280;
}

.full{
    background:#16a34a;
}

.hidden{
    display:none;
}

label{
    display:block;
    margin-bottom:15px;
}

#editor textarea{
    height:150px;
}

#status{
    color:#9ca3af;
    margin-top:10px;
}

@media(max-width:700px){
    .bin{
        width:90px;
        min-height:75px;
    }
}
</style>
</head>
<body>

<header>
    <h1>Garage Storage Organizer</h1>

    <input
        id="search"
        placeholder="Search bins..."
    >
</header>

<div class="panel">

    <h2>Shelf Settings</h2>

    <label>
        Total Bins
        <input id="totalBins" type="number" min="1" max="500">
    </label>

    <label>
        Bins Per Shelf
        <input id="binsPerShelf" type="number" min="1" max="50">
    </label>

    <button id="saveLayout">
        Save Layout
    </button>

</div>

<div id="shelves"></div>

<div id="editor" class="panel hidden">

    <h2 id="binTitle"></h2>

    <label>
        Bin Name
        <input id="binName">
    </label>

    <label>
        Contents
        <textarea id="binContents"></textarea>
    </label>

    <button id="saveBin">
        Save Bin
    </button>

    <p id="status"></p>

</div>

<script>

const SUPABASE_URL =
"https://cujvvxyadxvlfvhgzlki.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wogqNQurYqmvOx9FvoFxMQ_XyRMTxZ_";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentBin = null;

let settings = {
    totalBins: 42,
    binsPerShelf: 6
};

let bins = {};

const shelves =
document.getElementById("shelves");

async function loadSettings(){

    const { data } =
    await supabase
    .from("settings")
    .select("*")
    .eq("id",1)
    .single();

    if(data){

        settings.totalBins =
        data.total_bins;

        settings.binsPerShelf =
        data.bins_per_shelf;
    }

    document.getElementById("totalBins").value =
    settings.totalBins;

    document.getElementById("binsPerShelf").value =
    settings.binsPerShelf;
}

async function saveSettings(){

    await supabase
    .from("settings")
    .upsert({
        id:1,
        total_bins:
            parseInt(
                document.getElementById("totalBins").value
            ),
        bins_per_shelf:
            parseInt(
                document.getElementById("binsPerShelf").value
            )
    });

    await loadSettings();
    renderBins();
}

async function loadBins(){

    const { data } =
    await supabase
    .from("bins")
    .select("*");

    bins = {};

    if(data){

        data.forEach(bin => {

            bins[bin.id] = {
                name: bin.name || "",
                contents: bin.contents || "",
                updated_at: bin.updated_at || ""
            };

        });
    }
}

function renderBins(filter=""){

    shelves.innerHTML = "";

    let shelfRow;

    for(
        let i=1;
        i<=settings.totalBins;
        i++
    ){

        if(
            (i-1) %
            settings.binsPerShelf === 0
        ){

            const shelf =
            document.createElement("div");

            shelf.className =
            "shelf";

            const number =
            Math.floor(
                (i-1) /
                settings.binsPerShelf
            ) + 1;

            shelf.innerHTML =
            `<h2 class="shelf-title">
                Shelf ${number}
             </h2>`;

            shelfRow =
            document.createElement("div");

            shelfRow.className =
            "shelf-row";

            shelf.appendChild(shelfRow);

            shelves.appendChild(shelf);
        }

        const id =
        `BIN${String(i).padStart(2,"0")}`;

        const bin =
        bins[id] || {
            name:"",
            contents:""
        };

        const searchText =
        (
            bin.name +
            " " +
            bin.contents
        ).toLowerCase();

        if(
            filter &&
            !searchText.includes(
                filter.toLowerCase()
            )
        ){
            continue;
        }

        const card =
        document.createElement("div");

        card.className =
        "bin " +
        (
            bin.contents
            ? "full"
            : "empty"
        );

        card.innerHTML =
        `
        <strong>${id}</strong>
        <br>
        <small>
            ${bin.name || "Empty"}
        </small>
        `;

        card.onclick =
        () => openBin(id);

        shelfRow.appendChild(card);
    }
}

function openBin(id){

    currentBin = id;

    const bin =
    bins[id] || {};

    document
    .getElementById("editor")
    .classList
    .remove("hidden");

    document
    .getElementById("binTitle")
    .textContent = id;

    document
    .getElementById("binName")
    .value =
    bin.name || "";

    document
    .getElementById("binContents")
    .value =
    bin.contents || "";

    document
    .getElementById("status")
    .textContent =
    bin.updated_at
    ? "Last Updated: " + new Date(
        bin.updated_at
      ).toLocaleString()
    : "Never Updated";
}

async function saveCurrentBin(){

    if(!currentBin) return;

    await supabase
    .from("bins")
    .upsert({
        id: currentBin,
        name:
            document
            .getElementById("binName")
            .value,
        contents:
            document
            .getElementById("binContents")
            .value,
        updated_at:
            new Date().toISOString()
    });

    await loadBins();

    renderBins(
        document
        .getElementById("search")
        .value
    );

    alert("Saved");
}

document
.getElementById("saveBin")
.addEventListener(
    "click",
    saveCurrentBin
);

document
.getElementById("saveLayout")
.addEventListener(
    "click",
    saveSettings
);

document
.getElementById("search")
.addEventListener(
    "input",
    e => renderBins(e.target.value)
);

async function initialize(){

    await loadSettings();
    await loadBins();

    renderBins();
}

initialize();

</script>

</body>
</html>

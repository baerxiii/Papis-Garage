<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Storage Organizer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1f2937;
    color:white;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
}

h1{
    margin:0 0 15px;
}

.panel{
    background:#374151;
    margin:20px;
    padding:20px;
    border-radius:10px;
}

label{
    display:block;
    margin-bottom:15px;
}

input,
textarea,
    select{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#3b82f6;
}

.shelf{
    margin:20px;
}

.shelf-title{
    margin-bottom:10px;
}

.shelf-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.bin{
    width:120px;
    min-height:90px;
    border-radius:10px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.bin:hover{
    transform:scale(1.05);
}

.empty{
    background:#6b7280;
}

.full{
    background:#16a34a;
}

.hidden{
    display:none;
}

#editor textarea{
    height:150px;
}

#status{
    color:#d1d5db;
    margin-top:10px;
}

@media(max-width:700px){

    .bin{
        width:90px;
        min-height:75px;
    }

}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:1000;
}

.modal-content{

    background:#374151;

    width:90%;
    max-width:700px;

    padding:25px;

    border-radius:12px;

    position:relative;
}

.close-btn{

    position:absolute;

    top:10px;
    right:10px;

    width:40px;
    height:40px;

    background:#dc2626;

    border:none;

    border-radius:50%;

    color:white;

    cursor:pointer;
}

.close-btn:hover{
    background:#ef4444;
}

.hidden{
    display:none;
}

.modal textarea{
    height:200px;
}
    
</style>
</head>
<body>

<header>
    <h1>Papi's Bin Finder Program</h1>

    <div id="account" class="hidden">
        <span id="accountEmail"></span>
        <button id="signOut">Sign Out</button>
    </div>
</header>

<div id="authPanel" class="panel">
    <h2>Sign in or create an account</h2>
    <p>Each account has its own private inventory. To share an inventory, sign in to the same account.</p>
    <form id="authForm">
        <label>Email <input id="email" type="email" autocomplete="email" required></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign In</button>
        <button id="signUp" type="button">Sign Up</button>
    </form>
    <p id="authStatus" role="status">Checking session…</p>
</div>

<div id="loadError" class="panel hidden" role="alert">
    <p id="loadErrorMessage"></p>
    <button id="retryLoad">Retry</button>
</div>

<main id="app" class="hidden">
<div class="panel">
    <input
        id="search"
        placeholder="Search bins..."
    >
</div>

<div class="panel">

    <h2>Shelf Settings</h2>

    <label>
        Total Bins
        <input id="totalBins" type="number" min="1" max="500">
    </label>

    <label>
        Bins Per Shelf
        <input id="binsPerShelf" type="number" min="1" max="50">
    </label>

    <button id="saveLayout">
        Save Layout
    </button>

</div>

<div id="shelves"></div>

<div id="modal" class="modal hidden">

    <div class="modal-content">

        <button id="closeModal" class="close-btn">
            ✕
        </button>

        <h2 id="binTitle"></h2>

        <label>
    Bin Name
    <input id="binName">
</label>

<label>
    Category
    <select id="binCategory">
        <option value="">Select Category</option>
        <option value="Tools">Tools</option>
        <option value="Camping">Camping</option>
        <option value="Christmas">Christmas</option>
        <option value="Halloween">Halloween</option>
        <option value="Automotive">Automotive</option>
        <option value="Hardware">Hardware</option>
        <option value="Electronics">Electronics</option>
        <option value="Household">Household</option>
    </select>
</label>

<label>
    Contents
    <textarea id="binContents"></textarea>
</label>
        
<button id="saveBin">
    Save Bin
</button>

<hr>

<h3>QR Code</h3>

<div id="qrcode"></div>

<br>

<button id="printLabel">
    Print This Label
</button>

<button id="printAllLabels">
    Print All Labels
</button>

<div id="status"></div>

    </div>

</div>

</main>

<script>

const SUPABASE_URL =
"https://cujvvxyadxvlfvhgzlki.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wogqNQurYqmvOx9FvoFxMQ_XyRMTxZ_";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let settings = {
    totalBins: 42,
    binsPerShelf: 6
};

let bins = {};
let currentBin = null;
let currentUser = null;
let sessionVersion = 0;
let loaded = false;

const authPanel = document.getElementById("authPanel");
const authStatus = document.getElementById("authStatus");
const app = document.getElementById("app");
const account = document.getElementById("account");
const loadError = document.getElementById("loadError");

function isCurrent(userId, version){
    return currentUser?.id === userId && sessionVersion === version;
}

function clearInventory(){
    loaded = false;
    bins = {};
    settings = { totalBins: 42, binsPerShelf: 6 };
    currentBin = null;
    app.classList.add("hidden");
    loadError.classList.add("hidden");
    document.getElementById("modal").classList.add("hidden");
    document.getElementById("shelves").innerHTML = "";
    document.getElementById("search").value = "";
    document.getElementById("binName").value = "";
    document.getElementById("binCategory").value = "";
    document.getElementById("binContents").value = "";
    document.getElementById("qrcode").innerHTML = "";
}

function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
    })[char]);
}

async function authenticate(signUp){
    authStatus.textContent = signUp ? "Creating account…" : "Signing in…";
    try {
        const credentials = {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
        };
        const { data, error } = signUp
            ? await db.auth.signUp(credentials)
            : await db.auth.signInWithPassword(credentials);
        if(error) throw error;
        document.getElementById("password").value = "";
        if(signUp && !data.session){
            authStatus.textContent = "If signup is available, check your email for a confirmation link, then sign in.";
        }
    } catch(error) {
        authStatus.textContent = error.message || "Authentication failed. Please try again.";
    }
}

document.getElementById("authForm").addEventListener("submit", event => {
    event.preventDefault();
    authenticate(false);
});
document.getElementById("signUp").addEventListener("click", () => {
    if(document.getElementById("authForm").reportValidity()) authenticate(true);
});
document.getElementById("signOut").addEventListener("click", async () => {
    try {
        const { error } = await db.auth.signOut();
        if(error) throw error;
    } catch(error) {
        alert(error.message || "Sign out failed. Please try again.");
    }
});

    function getCategoryColor(category){

    switch(category){

        case "Tools":
            return "#2563eb";

        case "Camping":
            return "#16a34a";

        case "Christmas":
            return "#dc2626";

        case "Halloween":
            return "#ea580c";

        case "Automotive":
            return "#facc15";

        case "Hardware":
            return "#6b7280";

        case "Electronics":
            return "#7c3aed";

        case "Household":
            return "#06b6d4";

        default:
            return "#374151";
    }
}

const shelvesEl =
document.getElementById("shelves");

async function loadSettings(userId){

    const { data, error } = await db
        .from("settings")
        .select("total_bins,bins_per_shelf")
        .eq("user_id",userId)
        .maybeSingle();

    if(error) throw error;
    return {
        totalBins: data?.total_bins ?? 42,
        binsPerShelf: data?.bins_per_shelf ?? 6
    };
}

async function saveLayout(){

    if(!currentUser || !loaded) return;
    const userId = currentUser.id;
    const version = sessionVersion;
    const totalBins = Number(document.getElementById("totalBins").value);
    const binsPerShelf = Number(document.getElementById("binsPerShelf").value);
    if(!Number.isInteger(totalBins) || totalBins < 1 || totalBins > 500 ||
       !Number.isInteger(binsPerShelf) || binsPerShelf < 1 || binsPerShelf > 50){
        alert("Enter 1–500 total bins and 1–50 bins per shelf.");
        return;
    }

    try {
    const { error } = await db
        .from("settings")
        .upsert({
            id: 1,
            user_id: userId,
            total_bins: totalBins,
            bins_per_shelf: binsPerShelf
        }, { onConflict: "user_id" });

    if(error) throw error;
    if(!isCurrent(userId, version)) return;

    settings = { totalBins, binsPerShelf };
    renderBins(document.getElementById("search").value);
    alert("Layout Saved");
    } catch(error) {
        if(isCurrent(userId, version)) alert(error.message || "Could not save layout.");
    }
}

async function loadBins(userId){

    const { data, error } =
    await db
        .from("bins")
        .select("id,name,category,contents,updated_at")
        .eq("user_id",userId);

    if(error) throw error;

    const result = {};

    (data || []).forEach(bin => {

        result[bin.id] = {
    name: bin.name || "",
    category: bin.category || "",
    contents: bin.contents || "",
    updated_at: bin.updated_at || ""
};

    });
    return result;
}

function renderBins(filter=""){

    shelvesEl.innerHTML = "";

    let shelfRow;

    for(let i=1; i<=settings.totalBins; i++){

        if((i-1) % settings.binsPerShelf === 0){

            const shelf =
            document.createElement("div");

            shelf.className = "shelf";

            const shelfNumber =
            Math.floor(
                (i-1) / settings.binsPerShelf
            ) + 1;

            shelf.innerHTML =
            `<h2 class="shelf-title">
                Shelf ${shelfNumber}
             </h2>`;

            shelfRow =
            document.createElement("div");

            shelfRow.className =
                "shelf-row";

            shelf.appendChild(shelfRow);

            shelvesEl.appendChild(shelf);
        }

        const binId =
        `BIN${String(i).padStart(2,"0")}`;

        const bin =
        bins[binId] || {
            name:"",
            contents:""
        };

        const searchText =
        (
            (bin.name || "") +
            " " +
            (bin.contents || "")
        ).toLowerCase();

        if(
            filter &&
            !searchText.includes(
                filter.toLowerCase()
            )
        ){
            continue;
        }

        const card =
        document.createElement("div");

        card.className = "bin";

card.style.backgroundColor =
getCategoryColor(bin.category);

        card.innerHTML = `
    <strong>${binId}</strong>
    <br>
    <small>${escapeHtml(bin.name || "Empty")}</small>
    <br>
    <small>${escapeHtml(bin.category || "")}</small>
`;

        card.addEventListener(
            "click",
            () => openBin(binId)
        );

        shelfRow.appendChild(card);
    }
}

function openBin(id){

    if(!currentUser || !loaded) return;
    currentBin = id;

    const bin =
    bins[id] || {};

    document
        .getElementById("modal")
        .classList
        .remove("hidden");

    document.getElementById("binTitle")
        .textContent = id;

    document.getElementById("binName")
        .value = bin.name || "";

    document.getElementById("binCategory")
    .value = bin.category || "";

    document.getElementById("binContents")
        .value = bin.contents || "";

    document.getElementById("status")
        .textContent =
            bin.updated_at
            ? "Last Updated: " +
              new Date(
                bin.updated_at
              ).toLocaleString()
            : "Never Updated";

    const qrDiv =
document.getElementById("qrcode");

qrDiv.innerHTML = "";

const qrUrl =
`${window.location.origin}${window.location.pathname}?bin=${id}`;

new QRCode(qrDiv,{
    text: qrUrl,
    width: 200,
    height: 200
});
}

async function saveCurrentBin(){

    if(!currentBin || !currentUser || !loaded) return;
    const userId = currentUser.id;
    const version = sessionVersion;
    const binId = currentBin;

    const now =
    new Date().toISOString();

    try {
    const { error } =
    await db
        .from("bins")

    .upsert({
    id: binId,
    user_id: userId,

    name:
        document.getElementById("binName").value,

    category:
        document.getElementById("binCategory").value,

    contents:
        document.getElementById("binContents").value,

    updated_at: now
}, { onConflict: "user_id,id" });

    if(error) throw error;
    const refreshedBins = await loadBins(userId);
    if(!isCurrent(userId, version)) return;

    bins = refreshedBins;

    renderBins(
        document.getElementById("search").value
    );

    document.getElementById("status")
        .textContent =
        "Last Updated: " +
        new Date(now)
        .toLocaleString();

    alert("Saved");

    document
.getElementById("modal")
.classList
.add("hidden");
    } catch(error) {
        if(isCurrent(userId, version)) alert(error.message || "Could not save or reload bins.");
    }
}

document
.getElementById("saveLayout")
.addEventListener(
    "click",
    saveLayout
);

document
.getElementById("saveBin")
.addEventListener(
    "click",
    saveCurrentBin
);

document
.getElementById("search")
.addEventListener(
    "input",
    e => renderBins(e.target.value)
);

async function loadInventory(userId, version){
    clearInventory();
    try {
        const [newSettings, newBins] = await Promise.all([
            loadSettings(userId), loadBins(userId)
        ]);
        if(!isCurrent(userId, version)) return;
        if(!Number.isInteger(newSettings.totalBins) || newSettings.totalBins < 1 || newSettings.totalBins > 500 ||
           !Number.isInteger(newSettings.binsPerShelf) || newSettings.binsPerShelf < 1 || newSettings.binsPerShelf > 50){
            throw new Error("Invalid saved layout. Contact the database owner.");
        }
        settings = newSettings;
        bins = newBins;
        document.getElementById("totalBins").value = settings.totalBins;
        document.getElementById("binsPerShelf").value = settings.binsPerShelf;
        loaded = true;
        renderBins();
        app.classList.remove("hidden");

        const binFromQr = new URLSearchParams(window.location.search).get("bin");
        if(binFromQr && Array.from({length: settings.totalBins}, (_, i) =>
            `BIN${String(i + 1).padStart(2,"0")}`).includes(binFromQr)){
            openBin(binFromQr);
        }
    } catch(error) {
        if(!isCurrent(userId, version)) return;
        document.getElementById("loadErrorMessage").textContent =
            "Could not load your inventory: " + (error.message || "Please try again.");
        loadError.classList.remove("hidden");
    }
}

document.getElementById("retryLoad").addEventListener("click", () => {
    if(currentUser) loadInventory(currentUser.id, ++sessionVersion);
});

db.auth.onAuthStateChange((event, session) => {
    const user = session?.user || null;
    if(user && currentUser?.id === user.id) return;
    currentUser = user;
    const version = ++sessionVersion;
    clearInventory();
    account.classList.toggle("hidden", !user);
    authPanel.classList.toggle("hidden", !!user);
    document.getElementById("accountEmail").textContent = user?.email || "";
    if(user){
        setTimeout(() => {
            if(isCurrent(user.id, version)) loadInventory(user.id, version);
        }, 0);
    } else {
        authStatus.textContent = "Sign in to access your inventory.";
    }
});

db.auth.getSession().then(({ error }) => {
    if(error && !currentUser) authStatus.textContent = error.message;
}).catch(error => {
    if(!currentUser) authStatus.textContent = error.message || "Could not restore session.";
});

document
.getElementById("closeModal")
.addEventListener("click", () => {

    document
    .getElementById("modal")
    .classList
    .add("hidden");

});

    document
.getElementById("modal")
.addEventListener("click", (e) => {

    if(e.target.id === "modal"){

        document
        .getElementById("modal")
        .classList
        .add("hidden");

    }

});

    document
.getElementById("printLabel")
.addEventListener("click", () => {

    const canvas =
    document.querySelector("#qrcode canvas");

    if(!canvas){
        alert("QR Code not ready");
        return;
    }

    const qrImage =
    canvas.toDataURL();

    const binName =
    document.getElementById("binName").value ||
    "Unnamed Bin";

    const printWindow =
    window.open("", "_blank");

    printWindow.document.write(`
        <html>
        <head>
            <title>${currentBin}</title>
            <style>
                body{
                    text-align:center;
                    font-family:Arial;
                    padding:30px;
                }
                img{
                    width:250px;
                }
            </style>
        </head>
        <body>

            <h1>${currentBin}</h1>

            <h2>${escapeHtml(binName)}</h2>

            <img src="${qrImage}">

        </body>
        </html>
    `);

    printWindow.document.close();

    setTimeout(() => {
        printWindow.focus();
        printWindow.print();
    }, 5000);

});

document
.getElementById("printAllLabels")
.addEventListener("click", () => {

    const printWindow =
    window.open("", "_blank");

    let html = `
    <html>
    <head>
        <title>All Bin Labels</title>

        <style>

        body{
            font-family:Arial,sans-serif;
            padding:20px;
        }

        .label{
            width:280px;
            height:380px;

            border:2px solid #000;

            display:inline-flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;

            margin:10px;

            page-break-inside:avoid;
        }

        .bin-id{
            font-size:28px;
            font-weight:bold;
            margin-bottom:10px;
        }

        .bin-name{
            font-size:18px;
            margin-bottom:15px;
            text-align:center;
        }

        img{
            width:180px;
            height:180px;
        }

        </style>
    </head>
    <body>
    `;

    for(let i = 1; i <= settings.totalBins; i++){

        const id =
        `BIN${String(i).padStart(2,"0")}`;

        const bin =
        bins[id] || {};

        const name =
        bin.name || "Unnamed Bin";

        const qrUrl =
        `${window.location.origin}${window.location.pathname}?bin=${id}`;

        html += `
        <div class="label">

            <div class="bin-id">
                ${id}
            </div>

            <div class="bin-name">
                ${escapeHtml(name)}
            </div>

            <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrUrl)}">

        </div>
        `;
    }

    html += `
    </body>
    </html>
    `;

    printWindow.document.write(html);
    printWindow.document.close();

    setTimeout(() => {
        printWindow.print();
    }, 1000);

});
    
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Storage Organizer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1f2937;
    color:white;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
}

h1{
    margin:0 0 15px;
}

.panel{
    background:#374151;
    margin:20px;
    padding:20px;
    border-radius:10px;
}

label{
    display:block;
    margin-bottom:15px;
}

input,
textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#3b82f6;
}

.shelf{
    margin:20px;
}

.shelf-title{
    margin-bottom:10px;
}

.shelf-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.bin{
    width:120px;
    min-height:90px;
    border-radius:10px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.bin:hover{
    transform:scale(1.05);
}

.empty{
    background:#6b7280;
}

.full{
    background:#16a34a;
}

.hidden{
    display:none;
}

#editor textarea{
    height:150px;
}

#status{
    color:#d1d5db;
    margin-top:10px;
}

@media(max-width:700px){

    .bin{
        width:90px;
        min-height:75px;
    }

}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:1000;
}

.modal-content{

    background:#374151;

    width:90%;
    max-width:700px;

    padding:25px;

    border-radius:12px;

    position:relative;
}

.close-btn{

    position:absolute;

    top:10px;
    right:10px;

    width:40px;
    height:40px;

    background:#dc2626;

    border:none;

    border-radius:50%;

    color:white;

    cursor:pointer;
}

.close-btn:hover{
    background:#ef4444;
}

.hidden{
    display:none;
}

.modal textarea{
    height:200px;
}
    
</style>
</head>
<body>

<header>
    <h1>Garage Storage Organizer</h1>

    <input
        id="search"
        placeholder="Search bins..."
    >
</header>

<div class="panel">

    <h2>Shelf Settings</h2>

    <label>
        Total Bins
        <input id="totalBins" type="number" min="1" max="500">
    </label>

    <label>
        Bins Per Shelf
        <input id="binsPerShelf" type="number" min="1" max="50">
    </label>

    <button id="saveLayout">
        Save Layout
    </button>

</div>

<div id="shelves"></div>

<div id="modal" class="modal hidden">

    <div class="modal-content">

        <button id="closeModal" class="close-btn">
            ✕
        </button>

        <h2 id="binTitle"></h2>

        <label>
            Bin Name
            <input id="binName">
        </label>

        <label>
            Contents
            <textarea id="binContents"></textarea>
        </label>
        
<button id="saveBin">
    Save Bin
</button>

<hr>

<h3>QR Code</h3>

<div id="qrcode"></div>

<br>

<button id="printLabel">
    Print This Label
</button>

<button id="printAllLabels">
    Print All Labels
</button>

<div id="status"></div>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://cujvvxyadxvlfvhgzlki.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wogqNQurYqmvOx9FvoFxMQ_XyRMTxZ_";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let settings = {
    totalBins: 42,
    binsPerShelf: 6
};

let bins = {};
let currentBin = null;

const shelvesEl =
document.getElementById("shelves");

async function loadSettings(){

    const { data, error } = await db
        .from("settings")
        .select("*")
        .eq("id",1)
        .maybeSingle();

    if(error){
        console.error(error);
    }

    if(data){
        settings.totalBins =
            data.total_bins ?? 42;

        settings.binsPerShelf =
            data.bins_per_shelf ?? 6;
    }
    else{
        settings.totalBins = 42;
        settings.binsPerShelf = 6;
    }

    document.getElementById("totalBins").value =
        settings.totalBins;

    document.getElementById("binsPerShelf").value =
        settings.binsPerShelf;
}

async function saveLayout(){

    settings.totalBins =
        parseInt(
            document.getElementById("totalBins").value
        ) || 42;

    settings.binsPerShelf =
        parseInt(
            document.getElementById("binsPerShelf").value
        ) || 6;

    const { error } =
    await db
        .from("settings")
        .upsert({
            id: 1,
            total_bins: settings.totalBins,
            bins_per_shelf: settings.binsPerShelf
        });

    if(error){
        console.error(error);
        alert(error.message);
        return;
    }

    renderBins();
    alert("Layout Saved");
}

async function loadBins(){

    const { data, error } =
    await db
        .from("bins")
        .select("*");

    if(error){
        console.error(error);
        return;
    }

    bins = {};

    (data || []).forEach(bin => {

        bins[bin.id] = {
            name: bin.name || "",
            contents: bin.contents || "",
            updated_at: bin.updated_at || ""
        };

    });
}

function renderBins(filter=""){

    shelvesEl.innerHTML = "";

    let shelfRow;

    for(let i=1; i<=settings.totalBins; i++){

        if((i-1) % settings.binsPerShelf === 0){

            const shelf =
            document.createElement("div");

            shelf.className = "shelf";

            const shelfNumber =
            Math.floor(
                (i-1) / settings.binsPerShelf
            ) + 1;

            shelf.innerHTML =
            `<h2 class="shelf-title">
                Shelf ${shelfNumber}
             </h2>`;

            shelfRow =
            document.createElement("div");

            shelfRow.className =
                "shelf-row";

            shelf.appendChild(shelfRow);

            shelvesEl.appendChild(shelf);
        }

        const binId =
        `BIN${String(i).padStart(2,"0")}`;

        const bin =
        bins[binId] || {
            name:"",
            contents:""
        };

        const searchText =
        (
            (bin.name || "") +
            " " +
            (bin.contents || "")
        ).toLowerCase();

        if(
            filter &&
            !searchText.includes(
                filter.toLowerCase()
            )
        ){
            continue;
        }

        const card =
        document.createElement("div");

        card.className =
        "bin " +
        (
            bin.contents.trim()
            ? "full"
            : "empty"
        );

        card.innerHTML = `
            <strong>${binId}</strong>
            <br>
            <small>${bin.name || "Empty"}</small>
        `;

        card.addEventListener(
            "click",
            () => openBin(binId)
        );

        shelfRow.appendChild(card);
    }
}

function openBin(id){

    currentBin = id;

    const bin =
    bins[id] || {};

    document
        .getElementById("modal")
        .classList
        .remove("hidden");

    document.getElementById("binTitle")
        .textContent = id;

    document.getElementById("binName")
        .value = bin.name || "";

    document.getElementById("binContents")
        .value = bin.contents || "";

    document.getElementById("status")
        .textContent =
            bin.updated_at
            ? "Last Updated: " +
              new Date(
                bin.updated_at
              ).toLocaleString()
            : "Never Updated";

    const qrDiv =
document.getElementById("qrcode");

qrDiv.innerHTML = "";

const qrUrl =
`${window.location.origin}${window.location.pathname}?bin=${id}`;

new QRCode(qrDiv,{
    text: qrUrl,
    width: 200,
    height: 200
});
}

async function saveCurrentBin(){

    if(!currentBin) return;

    const now =
    new Date().toISOString();

    const { error } =
    await db
        .from("bins")
        .upsert({
            id: currentBin,
            name:
                document.getElementById("binName").value,
            contents:
                document.getElementById("binContents").value,
            updated_at: now
        });

    if(error){
        console.error(error);
        alert(error.message);
        return;
    }

    await loadBins();

    renderBins(
        document.getElementById("search").value
    );

    document.getElementById("status")
        .textContent =
        "Last Updated: " +
        new Date(now)
        .toLocaleString();

    alert("Saved");

    document
.getElementById("modal")
.classList
.add("hidden");
    
}

document
.getElementById("saveLayout")
.addEventListener(
    "click",
    saveLayout
);

document
.getElementById("saveBin")
.addEventListener(
    "click",
    saveCurrentBin
);

document
.getElementById("search")
.addEventListener(
    "input",
    e => renderBins(e.target.value)
);

async function init(){

    console.log("Starting app...");

    await loadSettings();
    await loadBins();

    renderBins();

    const params =
new URLSearchParams(window.location.search);

const binFromQr =
params.get("bin");

if(binFromQr){

    setTimeout(() => {

        openBin(binFromQr);

    }, 500);
}

    console.log("App loaded");
}

init().catch(console.error);

document
.getElementById("closeModal")
.addEventListener("click", () => {

    document
    .getElementById("modal")
    .classList
    .add("hidden");

});

    document
.getElementById("modal")
.addEventListener("click", (e) => {

    if(e.target.id === "modal"){

        document
        .getElementById("modal")
        .classList
        .add("hidden");

    }

});

    document
.getElementById("printLabel")
.addEventListener("click", () => {

    const canvas =
    document.querySelector("#qrcode canvas");

    if(!canvas){
        alert("QR Code not ready");
        return;
    }

    const qrImage =
    canvas.toDataURL();

    const binName =
    document.getElementById("binName").value ||
    "Unnamed Bin";

    const printWindow =
    window.open("", "_blank");

    printWindow.document.write(`
        <html>
        <head>
            <title>${currentBin}</title>
            <style>
                body{
                    text-align:center;
                    font-family:Arial;
                    padding:30px;
                }
                img{
                    width:250px;
                }
            </style>
        </head>
        <body>

            <h1>${currentBin}</h1>

            <h2>${binName}</h2>

            ${qrImage}

        </body>
        </html>
    `);

    printWindow.document.close();

    setTimeout(() => {
        printWindow.print();
    }, 500);

});
    
</script>

</body>
</html>
